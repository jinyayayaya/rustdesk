name: Build RustDesk ARM64 for RK3568

on:
  workflow_dispatch:
  push:
    branches:
      - rk3568-1.4.9

env:
  VERSION: "1.4.9"
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"

jobs:
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.22.3"
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build-rk3568-arm64:
    needs: [generate-bridge]
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y nasm libva-dev pkg-config

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet arm64-linux \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Restore bridge files again
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - uses: rustdesk-org/run-on-arch-action@d3fcfbb632b84cf7f6bc772bfaaa2c2f4f8789a8
        name: Build rustdesk with RKMPP
        with:
          arch: aarch64
          distro: ubuntu18.04
          githubToken: ${{ github.token }}
          setup: |
            ls -l "${PWD}"
            ls -l /opt/artifacts/vcpkg/installed
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
            --volume "/opt/artifacts:/opt/artifacts"
          shell: /bin/bash
          install: |
            apt-get update -y
            apt-get install -y \
               build-essential \
               clang \
               cmake \
               curl \
               gcc \
               git \
               g++ \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libclang-10-dev \
               libdrm-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpam0g-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-10-dev \
               nasm \
               ninja-build \
               pkg-config \
               tree \
               python3 \
               rpm \
               unzip \
               wget \
               xz-utils \
               libssl-dev
            apt-get remove -y libopus-dev || true
          run: |
            set -e
            git config --global --add safe.directory "*"
            
            # Upgrade CMake to 3.28.3 (Ubuntu 18.04 default CMake 3.10 cannot build Rockchip MPP)
            echo "=== Upgrading CMake ==="
            wget -qO- https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-linux-aarch64.tar.gz | tar -xz -C /usr --strip-components=1
            cmake --version

            # 1. Build and install Rockchip MPP
            echo "=== Building Rockchip MPP ==="
            git clone --depth=1 https://github.com/rockchip-linux/mpp.git /opt/mpp
            cmake -B /opt/mpp/build -S /opt/mpp -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TEST=OFF
            make -C /opt/mpp/build -j$(nproc)
            make -C /opt/mpp/build install
            
            # 2. Build static ffmpeg-rockchip
            echo "=== Building FFmpeg Rockchip ==="
            export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/lib64/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH
            git clone --depth=1 https://github.com/nyanmisaka/ffmpeg-rockchip.git /opt/ffmpeg-rockchip
            pushd /opt/ffmpeg-rockchip
            ./configure --prefix=/opt/ffmpeg-install \
              --enable-version3 --enable-static --disable-shared --enable-pic \
              --enable-rkmpp --enable-libdrm \
              --disable-doc --disable-programs --disable-everything \
              --enable-avcodec --enable-avformat --enable-avutil \
              --enable-decoder=h264,h264_rkmpp,hevc,hevc_rkmpp \
              --enable-encoder=h264_rkmpp,hevc_rkmpp \
              --enable-parser=h264,hevc \
              --enable-bsf=h264_mp4toannexb,hevc_mp4toannexb,h264_metadata,hevc_metadata \
              --enable-protocol=file --enable-muxer=mp4
            make -j$(nproc)
            make install
            popd
            
            # Replace vcpkg ffmpeg with rockchip ffmpeg
            echo "=== Overwriting vcpkg FFmpeg with FFmpeg Rockchip ==="
            cp -f /opt/ffmpeg-install/lib/libavcodec.a /opt/artifacts/vcpkg/installed/arm64-linux/lib/
            cp -f /opt/ffmpeg-install/lib/libavutil.a /opt/artifacts/vcpkg/installed/arm64-linux/lib/
            cp -f /opt/ffmpeg-install/lib/libavformat.a /opt/artifacts/vcpkg/installed/arm64-linux/lib/
            cp -rf /opt/ffmpeg-install/include/* /opt/artifacts/vcpkg/installed/arm64-linux/include/

            # 3. Setup Rust toolchain
            pushd /opt
            wget -O rust.tar.gz https://static.rust-lang.org/dist/rust-1.75.0-aarch64-unknown-linux-gnu.tar.gz
            tar -zxvf rust.tar.gz > /dev/null && rm rust.tar.gz
            cd rust-1.75.0-aarch64-unknown-linux-gnu && ./install.sh
            rm -rf rust-1.75.0-aarch64-unknown-linux-gnu
            popd

            # 4. Cargo build librustdesk.so
            pushd /workspace
            sed -i "s/\[\"cdylib\", \"staticlib\", \"rlib\"\]/\[\"cdylib\"\]/g" Cargo.toml
            export VCPKG_ROOT=/opt/artifacts/vcpkg
            cargo build --lib --jobs 4 --features hwcodec,flutter,unix-file-copy-paste --release
            cp -f target/release/librustdesk.so /workspace/librustdesk.so
            rm -rf target/release/deps target/release/build
            rm -rf ~/.cargo
            popd

            # 5. Setup Flutter & flutter-elinux
            pushd /workspace
            export PATH=/opt/flutter-elinux/bin:$PATH
            sed -i "s/flutter build linux --release/flutter-elinux build linux --verbose/g" ./build.py
            sed -i "s/x64\/release/arm64\/release/g" ./build.py
            popd
            
            pushd /opt
            wget https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            tar xf flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            git clone https://github.com/sony/flutter-elinux.git
            pushd flutter-elinux
              git reset --hard ${{ env.FLUTTER_VERSION }}
              bin/flutter-elinux doctor -v
              bin/flutter-elinux precache --linux
            popd
            cp -R flutter/bin/cache/artifacts/engine/linux-x64/shader_lib flutter-elinux/flutter/bin/cache/artifacts/engine/linux-arm64
            rm -rf flutter
            popd

            pushd /opt/flutter-elinux/flutter
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff || true
            popd

            # 6. Build package
            pushd /workspace
            export CARGO_INCREMENTAL=0
            export DEB_ARCH=arm64
            python3 ./build.py --flutter --skip-cargo
            for name in rustdesk*??.deb; do
              mv "$name" "${name%%.deb}-arm64.deb"
            done
            ls -lh *.deb /workspace/librustdesk.so
            popd

      - name: Upload Debian Package
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-1.4.9-rk3568-arm64.deb
          path: ./rustdesk-*-arm64.deb

      - name: Upload librustdesk.so
        uses: actions/upload-artifact@v4
        with:
          name: librustdesk.so
          path: ./librustdesk.so
